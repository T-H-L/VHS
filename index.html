    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.firebaseModules = {
            initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged,
            getFirestore, doc, setDoc, onSnapshot
        };
        
        if (window.initFirebaseApp) {
            window.initFirebaseApp();
        }
    </script>
    <script>
        tailwind.config = {
// ... existing code ... -->
    <!-- ========================================================= -->
    <!-- SCRIPT JAVASCRIPT COMPLET                                 -->
    <!-- ========================================================= -->
    <script>
        const STORAGE_KEY = 'vhs_handball_sport_v3';
        const COACH_PIN_CODE = '06140';

        const REGULAR_SCHEDULES = {
            1: { dayName: 'Lundi', start: '18:15', end: '19:30', title: 'Entraînement Lundi' },
            3: { dayName: 'Mercredi', start: '16:30', end: '18:00', title: 'Entraînement Mercredi' }
        };

        const DEFAULT_PLAYERS = [
            { id: 'p1', name: 'Inès', number: '', role: 'Joueur' },
            { id: 'p2', name: 'Romeo', number: '', role: 'Joueur' },
            { id: 'p3', name: 'Evan', number: '', role: 'Joueur' },
            { id: 'p4', name: 'Robin', number: '', role: 'Joueur' },
            { id: 'p5', name: 'Malone', number: '', role: 'Joueur' },
            { id: 'p6', name: 'Nathan', number: '', role: 'Joueur' },
            { id: 'p7', name: 'Nolan M', number: '', role: 'Joueur' },
            { id: 'p8', name: 'Nolan P', number: '', role: 'Joueur' },
            { id: 'p9', name: 'Heni', number: '', role: 'Joueur' },
            { id: 'p10', name: 'Dimitri', number: '', role: 'Joueur' },
            { id: 'p11', name: 'Owen', number: '', role: 'Joueur' },
            { id: 'p12', name: 'Logan', number: '', role: 'Joueur' },
            { id: 'p13', name: 'Fabio', number: '', role: 'Joueur' },
            { id: 'p14', name: 'Felix', number: '', role: 'Joueur' }
        ];

        function getDefaultEvents() {
            return [
                {
                    id: 'e_lun1',
                    type: 'training',
                    title: 'Entraînement Lundi',
                    date: '2026-11-16',
                    time: '18:15',
                    endTime: '19:30',
                    location: 'Gymnase Dandreis, Vence'
                },
                {
                    id: 'e_mer1',
                    type: 'training',
                    title: 'Entraînement Mercredi',
                    date: '2026-11-18',
                    time: '16:30',
                    endTime: '18:00',
                    location: 'Gymnase Dandreis, Vence'
                },
                {
                    id: 'e_match1',
                    type: 'match',
                    title: 'Match vs Cavigal Nice',
                    date: '2026-11-21',
                    time: '14:30',
                    endTime: '16:00',
                    location: 'Gymnase Dandreis, Vence (Domicile)',
                    selectedPlayerIds: ['p1', 'p2', 'p3', 'p5', 'p6', 'p7', 'p9', 'p10', 'p12', 'p13']
                },
                {
                    id: 'e_lun2',
                    type: 'training',
                    title: 'Entraînement Lundi',
                    date: '2026-11-23',
                    time: '18:15',
                    endTime: '19:30',
                    location: 'Gymnase Dandreis, Vence'
                },
                {
                    id: 'e_mer2',
                    type: 'training',
                    title: 'Entraînement Mercredi',
                    date: '2026-11-25',
                    time: '16:30',
                    endTime: '18:00',
                    location: 'Gymnase Dandreis, Vence'
                }
            ];
        }

        let appState = {
            players: [],
            events: [],
            attendance: {},
            selectedEventId: null,
            eventFilter: 'all',
            activeTab: 'attendance',
            userRole: 'player',
            showNonSelectedInMatch: true
        };

        let db = null;
        let auth = null;
        let unsubscribeFirestore = null;
        let isSyncingFromRemote = false;

        // Démarrage garanti au chargement avec fallback local immédiat
        window.addEventListener('DOMContentLoaded', () => {
            try {
                loadStateLocallyFirst();
            } catch (err) {
                console.error("Erreur critique au démarrage:", err);
                initDefaultState();
                renderAll();
            }

            if (window.firebaseModules) {
                initFirebaseApp();
            }
        });

        function loadStateLocallyFirst() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                const parsed = JSON.parse(saved);
                appState.players = parsed.players || [...DEFAULT_PLAYERS];
                appState.events = parsed.events || getDefaultEvents();
                appState.attendance = parsed.attendance || {};
                appState.selectedEventId = parsed.selectedEventId || (appState.events[0] ? appState.events[0].id : null);
                appState.userRole = parsed.userRole || 'player';
            } else {
                initDefaultState();
            }
            ensureValidEventsState();
            renderAll();
        }

        function ensureValidEventsState() {
            appState.events.forEach(ev => {
                if (ev.type === 'match' && !Array.isArray(ev.selectedPlayerIds)) {
                    ev.selectedPlayerIds = [];
                }
            });
            if (!appState.events.some(ev => ev.id === appState.selectedEventId)) {
                appState.selectedEventId = appState.events.length > 0 ? appState.events[0].id : null;
            }
        }

        function initDefaultState() {
            appState.players = JSON.parse(JSON.stringify(DEFAULT_PLAYERS));
            appState.events = getDefaultEvents();
            appState.attendance = {};
            appState.userRole = 'player';
            if (appState.events[0]) {
                const firstEventId = appState.events[0].id;
                appState.attendance[firstEventId] = {
                    'p1': { status: 'present', note: '' },
                    'p2': { status: 'present', note: '' },
                    'p3': { status: 'present', note: '' },
                    'p4': { status: 'absent', note: 'Excusé' },
                    'p5': { status: 'present', note: '' },
                    'p6': { status: 'present', note: 'En retard 10 min' }
                };
            }
            appState.selectedEventId = appState.events[0].id;
            saveStateLocally();
        }

        window.initFirebaseApp = async function() {
            if (!window.firebaseModules) return;
            try {
                const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, getFirestore, doc, onSnapshot } = window.firebaseModules;
                
                const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
                    apiKey: "demo-api-key", projectId: "vhs-handball-demo"
                };
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'vhs-handball-sport-default';

                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                if (!auth.currentUser) return;

                const docRef = doc(db, 'artifacts', appId, 'public', 'vhs_team_data');

                if (unsubscribeFirestore) unsubscribeFirestore();

                unsubscribeFirestore = onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const remoteData = docSnap.data();
                        if (remoteData && remoteData.updatedAt) {
                            isSyncingFromRemote = true;
                            appState.players = remoteData.players || appState.players;
                            appState.events = remoteData.events || appState.events;
                            appState.attendance = remoteData.attendance || appState.attendance;
                            ensureValidEventsState();
                            if (!appState.events.some(e => e.id === appState.selectedEventId) && appState.events.length > 0) {
                                appState.selectedEventId = appState.events[0].id;
                            }
                            saveStateLocally();
                            renderAll();
                            isSyncingFromRemote = false;
                        }
                    } else {
                        saveStateToCloud();
                    }
                }, (error) => {
                    console.error("Firestore sync error:", error);
                });

            } catch (e) {
                console.warn("Firebase non disponible, fonctionnement en mode local autonome:", e);
            }
        };

        function saveStateLocally() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    players: appState.players,
                    events: appState.events,
                    attendance: appState.attendance,
                    selectedEventId: appState.selectedEventId,
                    userRole: appState.userRole
                }));
            } catch (e) {
                console.error('localStorage error:', e);
            }
        }

        async function saveStateToCloud() {
            saveStateLocally();
            if (isSyncingFromRemote || !db || !auth || !auth.currentUser) return;
            try {
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'vhs-handball-sport-default';
                const docRef = window.firebaseModules.doc(db, 'artifacts', appId, 'public', 'vhs_team_data');
                await window.firebaseModules.setDoc(docRef, {
                    players: appState.players,
                    events: appState.events,
                    attendance: appState.attendance,
                    updatedAt: Date.now()
                });
            } catch (e) {
                console.error("Cloud save error:", e);
            }
        }

        function saveState() {
            saveStateToCloud();
        }

        function isCoach() {
            return appState.userRole === 'coach';
        }

        function switchUserRole(role) {
            appState.userRole = role;
            saveState();
            renderAll();
            showToast(role === 'coach' ? 'Mode Coach activé' : 'Mode Joueur / Parent activé');
        }

        function requestCoachMode() {
            if (isCoach()) return;
            document.getElementById('coachPinInput').value = '';
            document.getElementById('coachPinError').classList.add('hidden');
            openModal('coachPinModal');
            setTimeout(() => document.getElementById('coachPinInput').focus(), 50);
        }

        function handleCoachPinSubmit(e) {
            e.preventDefault();
            const pin = document.getElementById('coachPinInput').value.trim();
            if (pin === COACH_PIN_CODE) {
                closeModal('coachPinModal');
                switchUserRole('coach');
            } else {
                document.getElementById('coachPinError').classList.remove('hidden');
            }
        }

        function activateCoachModeDirect() {
            closeModal('coachPinModal');
            switchUserRole('coach');
        }

        function updateRoleUI() {
            const btnPlayer = document.getElementById('roleBtnPlayer');
            const btnCoach = document.getElementById('roleBtnCoach');
            const coachHeaderActions = document.getElementById('coachHeaderActions');
            const coachQuickScheduleBtns = document.getElementById('coachQuickScheduleBtns');
            const playerModeBannerHint = document.getElementById('playerModeBannerHint');
            const rosterCoachActions = document.getElementById('rosterCoachActions');

            if (isCoach()) {
                if (btnCoach) btnCoach.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-extrabold transition cursor-pointer bg-vhs-gold text-vhs-deep shadow-xs';
                if (btnPlayer) btnPlayer.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold transition cursor-pointer text-blue-100 hover:text-white';
                if (coachHeaderActions) { coachHeaderActions.classList.remove('hidden'); coachHeaderActions.classList.add('flex'); }
                if (coachQuickScheduleBtns) { coachQuickScheduleBtns.classList.remove('hidden'); coachQuickScheduleBtns.classList.add('flex'); }
                if (playerModeBannerHint) playerModeBannerHint.classList.add('hidden');
                if (rosterCoachActions) { rosterCoachActions.classList.remove('hidden'); rosterCoachActions.classList.add('flex'); }
            } else {
                if (btnPlayer) btnPlayer.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-extrabold transition cursor-pointer bg-white text-vhs-deep shadow-xs';
                if (btnCoach) btnCoach.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold transition cursor-pointer text-blue-100 hover:text-white';
                if (coachHeaderActions) { coachHeaderActions.classList.add('hidden'); coachHeaderActions.classList.remove('flex'); }
                if (coachQuickScheduleBtns) { coachQuickScheduleBtns.classList.add('hidden'); coachQuickScheduleBtns.classList.remove('flex'); }
                if (playerModeBannerHint) playerModeBannerHint.classList.remove('hidden');
                if (rosterCoachActions) { rosterCoachActions.classList.add('hidden'); rosterCoachActions.classList.remove('flex'); }
            }
        }

        function isPlayerConvokedForMatch(ev, playerId) {
            if (!ev || ev.type !== 'match') return true;
            const list = Array.isArray(ev.selectedPlayerIds) ? ev.selectedPlayerIds : [];
            return list.includes(playerId);
        }

        function toggleMatchConvocation(playerId) {
            if (!isCoach()) return;
            const ev = appState.events.find(e => e.id === appState.selectedEventId);
            if (!ev || ev.type !== 'match') return;

            if (!Array.isArray(ev.selectedPlayerIds)) ev.selectedPlayerIds = [];
            const idx = ev.selectedPlayerIds.indexOf(playerId);
            if (idx === -1) ev.selectedPlayerIds.push(playerId);
            else ev.selectedPlayerIds.splice(idx, 1);

            saveState();
            renderEventSelector();
            renderActiveEvent();
            renderMatrix();
        }

        function setAllMatchConvocations(selectAll) {
            if (!isCoach()) return;
            const ev = appState.events.find(e => e.id === appState.selectedEventId);
            if (!ev || ev.type !== 'match') return;

            ev.selectedPlayerIds = selectAll ? appState.players.map(p => p.id) : [];
            saveState();
            renderEventSelector();
            renderActiveEvent();
            renderMatrix();
            showToast(selectAll ? 'Tous les joueurs convoqués' : 'Sélection vidée');
        }

        function toggleShowNonSelected() {
            appState.showNonSelectedInMatch = !appState.showNonSelectedInMatch;
            renderAttendanceList();
        }

        function formatFrenchDate(dateStr) {
            if (!dateStr) return '';
            try {
                const [y, m, d] = dateStr.split('-').map(Number);
                return new Date(y, m - 1, d).toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
            } catch {
                return dateStr;
            }
        }

        function formatTimeSlot(start, end) {
            const s = (start || '').replace(':', 'h');
            if (!end) return s;
            return `${s} – ${end.replace(':', 'h')}`;
        }

        function getNextWeekdayDateStr(targetDayOfWeek, fromDate = new Date()) {
            const d = new Date(fromDate.getFullYear(), fromDate.getMonth(), fromDate.getDate());
            const currentDay = d.getDay();
            let diff = targetDayOfWeek - currentDay;
            if (diff < 0) diff += 7;
            d.setDate(d.getDate() + diff);
            return toLocalISODate(d);
        }

        function toLocalISODate(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function quickAddNextRegularTraining(dayOfWeek) {
            if (!isCoach()) return;
            const sched = REGULAR_SCHEDULES[dayOfWeek];
            if (!sched) return;
            const nextDate = getNextWeekdayDateStr(dayOfWeek);
            const newEvent = {
                id: 'ev_' + Date.now(),
                type: 'training',
                title: sched.title,
                date: nextDate,
                time: sched.start,
                endTime: sched.end,
                location: 'Gymnase Dandreis, Vence'
            };
            appState.events.push(newEvent);
            appState.events.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
            appState.selectedEventId = newEvent.id;
            saveState();
            switchMainTab('attendance');
            showToast(`${sched.title} ajouté`);
        }

        function generateNextFourWeeksTrainings() {
            if (!isCoach()) return;
            const baseDate = new Date();
            let addedCount = 0;
            for (let i = 0; i < 28; i++) {
                const d = new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate() + i);
                const dow = d.getDay();
                if (dow === 1 || dow === 3) {
                    const iso = toLocalISODate(d);
                    const exists = appState.events.some(ev => ev.type === 'training' && ev.date === iso);
                    if (!exists) {
                        const sched = REGULAR_SCHEDULES[dow];
                        appState.events.push({
                            id: `ev_${iso}_${dow}_${Math.random().toString(36).slice(2, 6)}`,
                            type: 'training',
                            title: sched.title,
                            date: iso,
                            time: sched.start,
                            endTime: sched.end,
                            location: 'Gymnase Dandreis, Vence'
                        });
                        addedCount++;
                    }
                }
            }
            if (addedCount > 0) {
                appState.events.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
                saveState();
                renderAll();
                showToast(`${addedCount} entraînements ajoutés !`);
            } else {
                showToast('Entraînements déjà planifiés.');
            }
        }

        function openEventModal() {
            if (!isCoach()) return;
            document.getElementById('eventDate').value = getNextWeekdayDateStr(1);
            document.querySelector('input[name="eventType"][value="training"]').checked = true;
            onEventTypeOrDateChange();
            openModal('eventModal');
        }

        function onEventTypeOrDateChange() {
            const type = document.querySelector('input[name="eventType"]:checked').value;
            const dateVal = document.getElementById('eventDate').value;
            const presetBar = document.getElementById('regularPresetBar');
            const titleInput = document.getElementById('eventTitle');
            const startInput = document.getElementById('eventTime');
            const endInput = document.getElementById('eventEndTime');

            if (type === 'training') {
                presetBar.classList.remove('hidden');
                if (dateVal) {
                    const [y, m, d] = dateVal.split('-').map(Number);
                    const dow = new Date(y, m - 1, d).getDay();
                    if (REGULAR_SCHEDULES[dow]) {
                        const sched = REGULAR_SCHEDULES[dow];
                        startInput.value = sched.start;
                        endInput.value = sched.end;
                        if (!titleInput.value || titleInput.value.startsWith('Entraînement')) titleInput.value = sched.title;
                    }
                }
            } else {
                presetBar.classList.add('hidden');
                if (titleInput.value.startsWith('Entraînement')) titleInput.value = '';
            }
        }

        function fillPresetTraining(dayOfWeek) {
            const sched = REGULAR_SCHEDULES[dayOfWeek];
            if (!sched) return;
            document.querySelector('input[name="eventType"][value="training"]').checked = true;
            document.getElementById('eventDate').value = getNextWeekdayDateStr(dayOfWeek);
            document.getElementById('eventTitle').value = sched.title;
            document.getElementById('eventTime').value = sched.start;
            document.getElementById('eventEndTime').value = sched.end;
            document.getElementById('eventLocation').value = 'Gymnase Dandreis, Vence';
        }

        function getPlayerAttendance(eventId, playerId) {
            if (!appState.attendance[eventId]) appState.attendance[eventId] = {};
            if (!appState.attendance[eventId][playerId]) appState.attendance[eventId][playerId] = { status: 'pending', note: '' };
            return appState.attendance[eventId][playerId];
        }

        function renderAll() {
            const countEl = document.getElementById('headerPlayerCount');
            if (countEl) countEl.textContent = appState.players.length;
            updateRoleUI();
            renderEventSelector();
            renderActiveEvent();
            renderMatrix();
            renderRoster();
            if (typeof lucide !== 'undefined' && lucide.createIcons) {
                lucide.createIcons();
            }
        }

        function switchMainTab(tabName) {
            appState.activeTab = tabName;
            ['attendance', 'matrix', 'roster'].forEach(t => {
                const view = document.getElementById(`view-${t}`);
                const nav = document.getElementById(`nav-${t}`);
                if (!view || !nav) return;
                if (t === tabName) {
                    view.classList.remove('hidden');
                    nav.classList.add('border-vhs-gold', 'text-white', 'font-extrabold');
                    nav.classList.remove('border-transparent', 'text-blue-100', 'font-semibold');
                } else {
                    view.classList.add('hidden');
                    nav.classList.remove('border-vhs-gold', 'text-white', 'font-extrabold');
                    nav.classList.add('border-transparent', 'text-blue-100', 'font-semibold');
                }
            });
            renderAll();
        }

        function setEventFilter(filter) {
            appState.eventFilter = filter;
            ['all', 'training', 'match'].forEach(f => {
                const btn = document.getElementById(`filter-${f}`);
                if (!btn) return;
                if (f === filter) btn.className = 'text-xs font-bold px-2.5 py-1 rounded-lg bg-vhs-royal text-white transition cursor-pointer';
                else btn.className = 'text-xs font-semibold px-2.5 py-1 rounded-lg bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition cursor-pointer';
            });
            renderEventSelector();
        }

        function renderEventSelector() {
            const container = document.getElementById('eventSelectorList');
            if (!container) return;
            const filteredEvents = appState.events.filter(ev => appState.eventFilter === 'all' || ev.type === appState.eventFilter);

            if (filteredEvents.length === 0) {
                container.innerHTML = `<div class="col-span-full bg-white border border-dashed border-slate-300 rounded-2xl p-6 text-center text-slate-500 text-sm">Aucun événement.</div>`;
                return;
            }

            container.innerHTML = filteredEvents.map(ev => {
                const isSelected = ev.id === appState.selectedEventId;
                const isMatch = ev.type === 'match';
                const targetPlayers = isMatch ? appState.players.filter(p => isPlayerConvokedForMatch(ev, p.id)) : appState.players;
                let presentCount = 0;
                targetPlayers.forEach(p => { if (getPlayerAttendance(ev.id, p.id).status === 'present') presentCount++; });

                const borderClass = isSelected ? 'border-vhs-royal ring-2 ring-vhs-royal/20 bg-white shadow-md' : 'border-slate-200 bg-white/85 hover:bg-white';
                const badgeClass = isMatch ? 'bg-vhs-goldLight text-vhs-deep border border-vhs-goldDark/40' : 'bg-blue-100 text-vhs-royal';

                return `
                    <button onclick="selectEvent('${ev.id}')" class="text-left p-3.5 rounded-2xl border-2 transition-all flex flex-col justify-between gap-2 cursor-pointer ${borderClass}">
                        <div class="flex items-center justify-between w-full gap-2">
                            <span class="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded-md ${badgeClass}">${isMatch ? '🏆 Match' : '🤾 Entraînement'}</span>
                            <span class="text-xs font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-200">${presentCount}/${targetPlayers.length}</span>
                        </div>
                        <div>
                            <div class="font-bold text-sm text-slate-900 truncate">${escapeHtml(ev.title)}</div>
                            <div class="text-xs text-slate-500">${formatFrenchDate(ev.date)} • ${ev.time}</div>
                        </div>
                    </button>
                `;
            }).join('');
        }

        function selectEvent(eventId) {
            appState.selectedEventId = eventId;
            saveState();
            renderEventSelector();
            renderActiveEvent();
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        function renderActiveEvent() {
            const panel = document.getElementById('activeEventPanel');
            if (!panel) return;
            const ev = appState.events.find(e => e.id === appState.selectedEventId);

            if (!ev) {
                panel.innerHTML = `<div class="p-10 text-center text-slate-500">Aucun événement sélectionné.</div>`;
                return;
            }

            const isMatch = ev.type === 'match';
            const badge = document.getElementById('activeEventBadge');
            if (badge) {
                badge.textContent = isMatch ? '🏆 MATCH • CONVOCATIONS' : '🤾 ENTRAÎNEMENT';
                badge.className = isMatch ? 'text-xs font-extrabold uppercase px-2.5 py-1 rounded-lg bg-vhs-gold text-vhs-deep' : 'text-xs font-extrabold uppercase px-2.5 py-1 rounded-lg bg-blue-100 text-vhs-royal';
            }

            const dateEl = document.getElementById('activeEventDate');
            if (dateEl) dateEl.innerHTML = `<i data-lucide="clock" class="w-4 h-4 text-vhs-royal"></i> <span class="capitalize">${formatFrenchDate(ev.date)}</span> • <strong>${formatTimeSlot(ev.time, ev.endTime)}</strong>`;
            
            const titleEl = document.getElementById('activeEventTitle');
            if (titleEl) titleEl.textContent = ev.title;

            const locEl = document.getElementById('activeEventLocation');
            if (locEl) locEl.innerHTML = `<i data-lucide="map-pin" class="w-4 h-4 text-vhs-royal shrink-0"></i> <span>${escapeHtml(ev.location || 'Gymnase Dandreis')}</span>`;

            const deleteBtn = document.getElementById('deleteEventBtn');
            if (deleteBtn) {
                if (isCoach()) deleteBtn.classList.remove('hidden');
                else deleteBtn.classList.add('hidden');
            }

            renderMatchConvocationPanel(ev);
            updateEventStats();
            renderAttendanceList();
        }

        function renderMatchConvocationPanel(ev) {
            const container = document.getElementById('matchConvocationPanel');
            if (!container) return;

            if (ev.type !== 'match') {
                container.classList.add('hidden');
                container.innerHTML = '';
                return;
            }

            container.classList.remove('hidden');
            const selectedIds = Array.isArray(ev.selectedPlayerIds) ? ev.selectedPlayerIds : [];
            const convokedCount = appState.players.filter(p => selectedIds.includes(p.id)).length;

            if (isCoach()) {
                container.innerHTML = `
                    <div class="p-4 sm:px-6 bg-vhs-goldLight/60 space-y-3">
                        <div class="flex flex-wrap items-center justify-between gap-2">
                            <div>
                                <h4 class="text-xs sm:text-sm font-black uppercase text-vhs-deep">Joueurs convoqués (${convokedCount} / ${appState.players.length})</h4>
                                <p class="text-[11px] text-slate-600">Cochez les joueurs retenus pour ce match.</p>
                            </div>
                            <div class="flex items-center gap-1.5 text-xs">
                                <button onclick="setAllMatchConvocations(true)" class="px-2.5 py-1 rounded-lg bg-white text-vhs-royal font-bold border border-vhs-royal/30 cursor-pointer">Tout cocher</button>
                                <button onclick="setAllMatchConvocations(false)" class="px-2.5 py-1 rounded-lg bg-white text-red-600 font-bold border border-red-200 cursor-pointer">Tout vider</button>
                            </div>
                        </div>
                        <div class="flex flex-wrap gap-2">
                            ${appState.players.map(p => {
                                const isConvoked = selectedIds.includes(p.id);
                                return `
                                    <button type="button" onclick="toggleMatchConvocation('${p.id}')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-extrabold border-2 cursor-pointer ${isConvoked ? 'bg-vhs-royal text-white border-vhs-royal' : 'bg-white text-slate-600 border-slate-200'}">
                                        <span>${escapeHtml(p.name)}</span>
                                    </button>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div class="px-4 sm:px-6 py-3 bg-blue-50 flex items-center justify-between text-xs">
                        <span class="text-vhs-deep font-semibold"><strong>${convokedCount} joueur(s) convoqué(s)</strong>. Seuls les joueurs sélectionnés peuvent répondre.</span>
                        <button onclick="requestCoachMode()" class="text-vhs-royal font-extrabold cursor-pointer">Mode Coach →</button>
                    </div>
                `;
            }
        }

        function updateEventStats() {
            const ev = appState.events.find(e => e.id === appState.selectedEventId);
            if (!ev) return;
            const isMatch = ev.type === 'match';
            const relevantPlayers = isMatch ? appState.players.filter(p => isPlayerConvokedForMatch(ev, p.id)) : appState.players;

            let present = 0, absent = 0, pending = 0;
            relevantPlayers.forEach(p => {
                const rec = getPlayerAttendance(ev.id, p.id);
                if (rec.status === 'present') present++;
                else if (rec.status === 'absent') absent++;
                else pending++;
            });

            const total = relevantPlayers.length;
            const rate = total > 0 ? Math.round((present / total) * 100) : 0;

            if (document.getElementById('statPresent')) document.getElementById('statPresent').textContent = present;
            if (document.getElementById('statPresentSub')) document.getElementById('statPresentSub').textContent = isMatch ? `Sur ${total} convoqués` : 'Confirmés';
            if (document.getElementById('statAbsent')) document.getElementById('statAbsent').textContent = absent;
            if (document.getElementById('statPending')) document.getElementById('statPending').textContent = pending;
            if (document.getElementById('statRate')) document.getElementById('statRate').textContent = `${rate}%`;
            if (document.getElementById('statProgressBar')) document.getElementById('statProgressBar').style.width = `${rate}%`;
        }

        function renderAttendanceList() {
            const listContainer = document.getElementById('attendancePlayerList');
            if (!listContainer) return;
            const ev = appState.events.find(e => e.id === appState.selectedEventId);
            if (!ev) return;

            const isMatch = ev.type === 'match';
            const query = (document.getElementById('playerSearchInput')?.value || '').toLowerCase().trim();
            const filteredPlayers = appState.players.filter(p => p.name.toLowerCase().includes(query));

            if (!isMatch) {
                if (filteredPlayers.length === 0) {
                    listContainer.innerHTML = `<div class="p-8 text-center text-slate-500">Aucun joueur.</div>`;
                    return;
                }
                listContainer.innerHTML = filteredPlayers.map(player => renderInteractivePlayerRow(ev, player, false)).join('');
                if (typeof lucide !== 'undefined') lucide.createIcons();
                return;
            }

            const convokedPlayers = filteredPlayers.filter(p => isPlayerConvokedForMatch(ev, p.id));
            const nonConvokedPlayers = filteredPlayers.filter(p => !isPlayerConvokedForMatch(ev, p.id));

            let html = '';
            if (convokedPlayers.length === 0) {
                html += `
                    <div class="p-8 text-center space-y-2 bg-amber-50/40">
                        <p class="text-sm font-extrabold text-vhs-deep">Aucun joueur convoqué pour le moment.</p>
                        <p class="text-xs text-slate-500">Le coach doit sélectionner les joueurs dans le panneau ci-dessus.</p>
                    </div>
                `;
            } else {
                html += `<div class="px-4 py-2 bg-vhs-royal/5 text-xs font-black text-vhs-royal">Joueurs convoqués (${convokedPlayers.length})</div>`;
                html += convokedPlayers.map(player => renderInteractivePlayerRow(ev, player, true)).join('');
            }

            if (nonConvokedPlayers.length > 0) {
                html += `
                    <div class="px-4 py-2.5 bg-slate-100 flex items-center justify-between text-xs font-bold text-slate-500 border-t border-slate-200">
                        <span>Non convoqués (${nonConvokedPlayers.length})</span>
                        <button onclick="toggleShowNonSelected()" class="text-vhs-royal cursor-pointer">${appState.showNonSelectedInMatch ? 'Masquer' : 'Afficher'}</button>
                    </div>
                `;
                if (appState.showNonSelectedInMatch) {
                    html += nonConvokedPlayers.map(player => `
                        <div class="px-4 py-3 bg-slate-50 flex items-center justify-between opacity-75 border-b border-slate-100">
                            <span class="font-semibold text-sm text-slate-600">${escapeHtml(player.name)}</span>
                            ${isCoach() ? `<button onclick="toggleMatchConvocation('${player.id}')" class="text-xs font-bold px-2 py-1 bg-white border border-vhs-royal text-vhs-royal rounded-lg cursor-pointer">+ Convoquer</button>` : '<span class="text-xs text-slate-400">Non convoqué</span>'}
                        </div>
                    `).join('');
                }
            }

            listContainer.innerHTML = html;
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        function renderInteractivePlayerRow(ev, player, isConvokedMatch) {
            const record = getPlayerAttendance(ev.id, player.id);
            const status = record.status;
            const note = record.note || '';
            const initials = player.name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);

            let rowBg = 'bg-white';
            if (status === 'present') rowBg = 'bg-emerald-50/40';
            else if (status === 'absent') rowBg = 'bg-red-50/40';

            return `
                <div class="p-3.5 sm:px-6 sm:py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-100 ${rowBg}">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-vhs-royal text-vhs-gold font-black text-sm flex items-center justify-center shrink-0">
                            ${player.number ? `#${player.number}` : initials}
                        </div>
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-base text-slate-900">${escapeHtml(player.name)}</span>
                                ${isConvokedMatch ? '<span class="text-[10px] font-extrabold px-2 py-0.5 rounded bg-vhs-goldLight text-vhs-deep">Convoqué</span>' : ''}
                            </div>
                            ${note ? `<div class="text-xs font-semibold text-vhs-royal">💬 ${escapeHtml(note)}</div>` : ''}
                        </div>
                    </div>
                    <div class="flex items-center gap-1.5 self-end sm:self-center">
                        <button onclick="setPlayerStatus('${player.id}', 'present')" class="px-3 py-2 rounded-xl text-xs font-bold cursor-pointer ${status === 'present' ? 'bg-emerald-600 text-white shadow' : 'bg-white text-slate-600 border border-slate-200'}">Présent</button>
                        <button onclick="setPlayerStatus('${player.id}', 'absent')" class="px-3 py-2 rounded-xl text-xs font-bold cursor-pointer ${status === 'absent' ? 'bg-red-600 text-white shadow' : 'bg-white text-slate-600 border border-slate-200'}">Absent</button>
                        <button onclick="setPlayerStatus('${player.id}', 'pending')" class="px-2.5 py-2 rounded-xl text-xs font-bold cursor-pointer ${status === 'pending' ? 'bg-vhs-gold text-vhs-deep shadow' : 'bg-white text-slate-500 border border-slate-200'}">?</button>
                        <button onclick="openNoteModal('${player.id}')" class="p-2 rounded-xl border border-slate-200 text-slate-400 hover:text-vhs-royal cursor-pointer">✏️</button>
                    </div>
                </div>
            `;
        }

        function setPlayerStatus(playerId, newStatus) {
            const ev = appState.events.find(e => e.id === appState.selectedEventId);
            if (!ev) return;
            if (ev.type === 'match' && !isPlayerConvokedForMatch(ev, playerId)) return;
            const record = getPlayerAttendance(ev.id, playerId);
            record.status = newStatus;
            saveState();
            renderEventSelector();
            updateEventStats();
            renderAttendanceList();
        }

        function markAllPlayers(status) {
            const ev = appState.events.find(e => e.id === appState.selectedEventId);
            if (!ev) return;
            const targetPlayers = ev.type === 'match' ? appState.players.filter(p => isPlayerConvokedForMatch(ev, p.id)) : appState.players;
            targetPlayers.forEach(p => { getPlayerAttendance(ev.id, p.id).status = status; });
            saveState();
            renderEventSelector();
            updateEventStats();
            renderAttendanceList();
            showToast('Mis à jour');
        }

        function renderMatrix() {
            const thead = document.getElementById('matrixTableHead');
            const tbody = document.getElementById('matrixTableBody');
            if (!thead || !tbody) return;

            if (appState.events.length === 0 || appState.players.length === 0) {
                thead.innerHTML = '';
                tbody.innerHTML = `<tr><td class="p-6 text-center text-slate-500">Aucune donnée.</td></tr>`;
                return;
            }

            thead.innerHTML = `
                <tr>
                    <th class="py-3 px-4 font-extrabold sticky left-0 bg-vhs-royal text-white">Joueur</th>
                    ${appState.events.map(ev => `<th class="py-3 px-3 text-center text-white"><div class="text-[10px] text-vhs-gold">${ev.type === 'match' ? 'MATCH' : 'ENTRAÎN.'}</div><div class="truncate max-w-[100px]">${escapeHtml(ev.title)}</div></th>`).join('')}
                    <th class="py-3 px-4 text-center text-white">Total</th>
                </tr>
            `;

            tbody.innerHTML = appState.players.map(player => {
                let presentCount = 0, eligible = 0;
                const cells = appState.events.map(ev => {
                    if (ev.type === 'match' && !isPlayerConvokedForMatch(ev, player.id)) {
                        return `<td class="py-2.5 px-3 text-center"><span class="text-slate-300">—</span></td>`;
                    }
                    eligible++;
                    const rec = getPlayerAttendance(ev.id, player.id);
                    if (rec.status === 'present') presentCount++;
                    let badge = '<span class="text-amber-600 font-bold">?</span>';
                    if (rec.status === 'present') badge = '<span class="text-emerald-600 font-bold">✓</span>';
                    else if (rec.status === 'absent') badge = '<span class="text-red-600 font-bold">✕</span>';
                    return `<td class="py-2.5 px-3 text-center">${badge}</td>`;
                }).join('');

                const rate = eligible > 0 ? Math.round((presentCount / eligible) * 100) : 0;
                return `
                    <tr class="hover:bg-slate-50 border-b border-slate-100">
                        <td class="py-2.5 px-4 font-bold text-slate-900 sticky left-0 bg-white">${escapeHtml(player.name)}</td>
                        ${cells}
                        <td class="py-2.5 px-4 text-center font-bold text-xs">${presentCount}/${eligible} (${rate}%)</td>
                    </tr>
                `;
            }).join('');
        }

        function renderRoster() {
            const grid = document.getElementById('rosterGrid');
            if (!grid) return;
            grid.innerHTML = appState.players.map(player => {
                const initials = player.name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
                return `
                    <div class="flex items-center justify-between p-3.5 rounded-2xl border border-slate-200 bg-slate-50">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-vhs-royal text-vhs-gold font-black text-sm flex items-center justify-center">${player.number ? `#${player.number}` : initials}</div>
                            <div>
                                <div class="font-bold text-slate-900">${escapeHtml(player.name)}</div>
                                <div class="text-xs text-slate-500">${escapeHtml(player.role || 'Joueur')}</div>
                            </div>
                        </div>
                        ${isCoach() ? `<button onclick="requestDeletePlayer('${player.id}')" class="p-2 text-slate-400 hover:text-red-600 cursor-pointer">🗑️</button>` : ''}
                    </div>
                `;
            }).join('');
        }

        function handleAddEvent(e) {
            e.preventDefault();
            if (!isCoach()) return;
            const type = document.querySelector('input[name="eventType"]:checked').value;
            const title = document.getElementById('eventTitle').value.trim();
            const date = document.getElementById('eventDate').value;
            const time = document.getElementById('eventTime').value;
            const endTime = document.getElementById('eventEndTime').value;
            const location = document.getElementById('eventLocation').value.trim();

            if (!title || !date || !time) return;

            const newEvent = {
                id: 'ev_' + Date.now(),
                type, title, date, time,
                endTime: endTime || '',
                location: location || 'Gymnase Dandreis, Vence',
                selectedPlayerIds: type === 'match' ? [] : undefined
            };

            appState.events.push(newEvent);
            appState.events.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
            appState.selectedEventId = newEvent.id;
            saveState();
            closeModal('eventModal');
            switchMainTab('attendance');
            showToast('Événement ajouté');
        }

        function handleAddPlayer(e) {
            e.preventDefault();
            if (!isCoach()) return;
            const name = document.getElementById('playerName').value.trim();
            const number = document.getElementById('playerNumber').value.trim();
            const role = document.getElementById('playerRole').value;
            if (!name) return;

            appState.players.push({ id: 'pl_' + Date.now(), name, number, role });
            saveState();
            closeModal('playerModal');
            document.getElementById('playerName').value = '';
            document.getElementById('playerNumber').value = '';
            renderAll();
            showToast(`${name} ajouté`);
        }

        function requestDeleteCurrentEvent() {
            if (!isCoach()) return;
            const ev = appState.events.find(e => e.id === appState.selectedEventId);
            if (!ev) return;
            openConfirmModal('Supprimer cet événement ?', `Voulez-vous supprimer "${ev.title}" ?`, () => {
                appState.events = appState.events.filter(e => e.id !== ev.id);
                delete appState.attendance[ev.id];
                appState.selectedEventId = appState.events.length > 0 ? appState.events[0].id : null;
                saveState();
                renderAll();
                showToast('Supprimé');
            });
        }

        function requestDeletePlayer(playerId) {
            if (!isCoach()) return;
            const player = appState.players.find(p => p.id === playerId);
            if (!player) return;
            openConfirmModal('Retirer ce joueur ?', `Retirer ${player.name} ?`, () => {
                appState.players = appState.players.filter(p => p.id !== playerId);
                Object.keys(appState.attendance).forEach(evId => { delete appState.attendance[evId][playerId]; });
                saveState();
                renderAll();
                showToast('Joueur retiré');
            });
        }

        function openNoteModal(playerId) {
            const ev = appState.events.find(e => e.id === appState.selectedEventId);
            const player = appState.players.find(p => p.id === playerId);
            if (!ev || !player) return;
            document.getElementById('notePlayerId').value = playerId;
            document.getElementById('notePlayerName').textContent = player.name;
            document.getElementById('noteInput').value = getPlayerAttendance(ev.id, playerId).note || '';
            openModal('noteModal');
        }

        function setQuickNote(text) {
            document.getElementById('noteInput').value = text;
        }

        function handleSaveNote(e) {
            e.preventDefault();
            const evId = appState.selectedEventId;
            const playerId = document.getElementById('notePlayerId').value;
            const note = document.getElementById('noteInput').value.trim();
            if (evId && playerId) {
                getPlayerAttendance(evId, playerId).note = note;
                saveState();
                renderAttendanceList();
                showToast('Note enregistrée');
            }
            closeModal('noteModal');
        }

        function copySummaryToClipboard() {
            const ev = appState.events.find(e => e.id === appState.selectedEventId);
            if (!ev) return;
            const isMatch = ev.type === 'match';
            const presents = [], absents = [], pendings = [];
            const targetPlayers = isMatch ? appState.players.filter(p => isPlayerConvokedForMatch(ev, p.id)) : appState.players;

            targetPlayers.forEach(p => {
                const rec = getPlayerAttendance(ev.id, p.id);
                const label = rec.note ? `${p.name} (${rec.note})` : p.name;
                if (rec.status === 'present') presents.push(label);
                else if (rec.status === 'absent') absents.push(label);
                else pendings.push(label);
            });

            const text = [
                `🔵🟡 *VENCE HANDBALL SPORT (VHS)*`,
                `${isMatch ? '🏆 MATCH' : '🤾 ENTRAÎNEMENT'} : *${ev.title}*`,
                `📅 ${formatFrenchDate(ev.date)} • ${formatTimeSlot(ev.time, ev.endTime)}`,
                ``,
                `✅ Présents (${presents.length}) : ${presents.join(', ') || 'Aucun'}`,
                `❌ Absents (${absents.length}) : ${absents.join(', ') || 'Aucun'}`,
                `⏳ En attente (${pendings.length}) : ${pendings.join(', ') || 'Aucun'}`
            ].join('\n');

            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('Copié pour WhatsApp !');
            } catch {
                showToast('Erreur copie', true);
            }
            document.body.removeChild(textarea);
        }

        function openModal(id) {
            const el = document.getElementById(id);
            if (el) { el.classList.remove('hidden'); el.classList.add('flex'); }
        }

        function closeModal(id) {
            const el = document.getElementById(id);
            if (el) { el.classList.add('hidden'); el.classList.remove('flex'); }
        }

        function openConfirmModal(title, message, onConfirm) {
            document.getElementById('confirmTitle').textContent = title;
            document.getElementById('confirmMessage').textContent = message;
            document.getElementById('confirmActionBtn').onclick = () => { closeModal('confirmModal'); onConfirm(); };
            openModal('confirmModal');
        }

        function showToast(msg, isError = false) {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `px-4 py-3 rounded-xl shadow-lg text-sm font-bold text-white ${isError ? 'bg-red-600' : 'bg-vhs-deep border border-vhs-gold'}`;
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
